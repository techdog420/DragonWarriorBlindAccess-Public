; Dragon Warrior Accessibility Mod Configuration
; Edit hotkey assignments below. Keys are normalized by the emulator adapter:
;   Letters: A-Z (uppercase)
;   Combos: Ctrl+N, Shift+F
;   Numbers: 0-9
;   Function keys: F1-F12
;   Special: space, enter, tab, backspace
; BizHawk NES controls use X=A, Z=B, Enter=Start, Space=Select; avoid those for mod hotkeys.
; BizHawk's S and A keys are NES autofire by default, so avoid those too.

; === Information Hotkeys (Shift+key) ===
; Announce map name and coordinates
key_position=Shift+P
; Announce current HP and MP
key_hp=Shift+H
; Announce player level
key_level=Shift+I
; Announce gold
key_gold=Shift+G
; Announce experience points
key_experience=Shift+E
; Announce full stat summary
key_stats=Shift+R
; Read all text on screen
key_screen_text=Shift+T

; === Object Navigation ===
; Cycle through nearby objects (NPCs, stairs, chests, exits)
; Previous object in list
key_object_prev=J
; Describe current object
key_object_current=K
; Next object in list
key_object_next=L
; Pathfind to selected object
key_pathfind=O
; Auto-walk to selected object using pathfinder
key_auto_walk=U
; Toggle NPC position freeze (locks NPCs in place for reliable pathfinding)
key_freeze_npcs=Shift+F
; Cycle object filter (All/NPCs/Exits/Chests)
key_filter=Q
; Wait this many frames before speaking rapid previous/next object taps (0 = immediate)
object_nav_speech_coalesce_frames=18

; === Diagnostics (Ctrl+key) ===
; Show raw menu cursor values
key_diag_cursor=Ctrl+M
; Dump PPU data to file
key_diag_ppu_dump=Ctrl+D

; === Settings added by script update ===
; Auto-complete tile steps from quick D-pad taps
enable_auto_step=true
; Max frames to wait for step to complete (increase if steps aren't finishing)
auto_step_timeout=45
; Frames to hold each auto-step press before waiting for movement
auto_step_inject_limit=12
; Frames before re-pressing after a turn-only attempt
auto_step_turn_repress_delay=18
; Number of quick turn-only re-press attempts before timeout retries (0 = safer BizHawk default)
auto_step_turn_repress_limit=0
; Neutral frames between turn-only press and re-press
auto_step_turn_repress_release_frames=2
; Internal retries before reporting a blocked step
auto_step_block_retry_limit=1
; Extra neutral frames before queued auto-walk changes direction
auto_step_route_turn_settle_frames=16
; Release injected D-pad once movement subpixel changes to reduce cell overshoot
auto_step_release_on_movement_start=true
; Frames the Yes/No cursor must be absent before prompt is dismissed
yesno_dismiss_frames=16
; Speak tile types at player position
key_diag_tiles=Ctrl+N
; Also write full tile_diag.txt when pressing Ctrl+N (slow; debugging only)
tile_diag_dump_on_hotkey=false

; === Settings added by script update ===
; Dump title screen cursor/RAM state to title_diag.txt (use on adventure log or message speed screens)
key_diag_title=Ctrl+Y

; === Settings added by script update ===
; Set true to enable dw_debug.log and dw_commands.txt processing
debug_mode=true
; Log verbosity when debug_mode=true: ERROR, INFO, or DEBUG
debug_log_level=DEBUG
; Set true to log every tile in chosen paths (slow; debugging only)
pathfind_log_steps=false

; === Settings added by script update ===
; Suppress duplicate queued speech within this many milliseconds (0 to disable)
speech_debounce_ms=1000



; === Settings added by script update ===
; Python executable for speech_bridge.py (set to .venv\Scripts\python.exe to use a local venv)
speech_python_cmd=python

; === Settings added by script update ===
; FCEUX only: mirror keyboard controls when menu focus leaves joypad input idle
enable_keyboard_input_bridge=true

; === Settings added by script update ===
; BizHawk only: enable mod hotkeys from input.get() (off by default to avoid stray screen-reader/typing keys)
enable_bizhawk_keyboard_hotkeys=false
; BizHawk only: comma-separated config key names allowed when full keyboard hotkeys are off
bizhawk_keyboard_hotkey_allowlist=key_object_prev,key_object_current,key_object_next,key_pathfind,key_auto_walk,key_filter,key_freeze_npcs,key_diag_tiles
; BizHawk only: include reachability/path checks in object descriptions (slower; pathfind still works)
bizhawk_object_reachability_descriptions=false
; BizHawk only: refresh moving NPC objects in the background (off avoids periodic audio hitches)
bizhawk_periodic_npc_refresh=false
; BizHawk only: refresh live NPC blockers before O/U path planning (slower)
bizhawk_route_refresh_npcs=false
; BizHawk only: freeze NPC RAM during auto-walk routes (slower)
bizhawk_autowalk_freeze_npcs=false
; BizHawk only: refresh object/NPC list immediately after route completion/cancel (slower)
bizhawk_route_cleanup_refresh_objects=false
