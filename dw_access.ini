; Dragon Warrior Accessibility Mod Configuration
; Edit hotkey assignments below. Keys are normalized by the emulator adapter:
;   Letters: A-Z (uppercase)
;   Combos: Ctrl+N, Shift+F
;   Numbers: 0-9
;   Function keys: F1-F24
;   Special: space, enter, tab, backspace, up, down, left, right
;   Alternatives: separate choices with |, e.g. K|F14
; BizHawk NES controls use X=A, Z=B, Enter=Start, Space=Select; avoid those for mod hotkeys.
; BizHawk's S and A keys are NES autofire by default, so avoid those too.

; === Information Hotkeys (Shift+key) ===
; Announce map name and coordinates
key_position=C|F17
; Announce current HP and MP
key_hp=H|F19
; Announce player level
key_level=I
; Announce gold
key_gold=G|F20
; Announce experience points
key_experience=E
; Announce full stat summary
key_stats=Shift+B
; Read all text on screen
key_screen_text=Shift+T
; Describe dungeon walls, paths, and objects inside the current light
key_visible_area=Shift+N|F21

; === Dungeon Darkness ===
; Dungeon navigation mode: balanced (full assistance while lit), authentic (current light only), or unrestricted. Legacy true/false mean authentic/unrestricted.
darkness_navigation_limits=balanced

; === Object Navigation ===
; Cycle through nearby objects (NPCs, stairs, chests, exits)
; Previous object in list
key_object_prev=J|F13
; Describe current object
key_object_current=K|F14
; Next object in list
key_object_next=L|F15
; Pathfind to selected object
key_pathfind=O|F16
; Start or check guided route for selected Travel object
key_route_guidance=R
; Read guided route status without starting or changing a route
key_route_status=Shift+R
; Auto-walk to selected object using pathfinder
key_auto_walk=U|F18
; Stop auto-walk and cancel guided Travel state immediately
key_stop_auto_walk=Shift+U
; Toggle NPC position freeze (locks NPCs in place for reliable pathfinding)
key_freeze_npcs=Shift+F
; Cycle object filter (All/NPCs/Services/Treasure/Travel/Doors)
key_filter=Q
; Previous object filter
key_filter_prev=Shift+J
; Return object filter to All
key_filter_all=Shift+K
; Next object filter
key_filter_next=Shift+L
; Mark the current object as visited
key_mark_visited=Shift+V
; Teleport to the selected object; NPCs use an adjacent interaction cell
key_teleport_exact=Shift+Enter
; Teleport to the cell north of the selected object
key_teleport_north=Shift+Up
; Teleport to the cell south of the selected object
key_teleport_south=Shift+Down
; Teleport to the cell west of the selected object
key_teleport_west=Shift+Left
; Teleport to the cell east of the selected object
key_teleport_east=Shift+Right
; Wait this many frames before speaking rapid previous/next object taps (0 = immediate)
object_nav_speech_coalesce_frames=18

; === Diagnostics (Ctrl+key) ===
; Show raw menu cursor values
key_diag_cursor=Ctrl+M
; Dump PPU data to file
key_diag_ppu_dump=Ctrl+D

; === Settings added by script update ===
; Auto-complete tile steps from quick D-pad taps
enable_auto_step=true
; Max frames to wait for step to complete (increase if steps aren't finishing)
auto_step_timeout=60
; Frames to hold raw D-pad input for probe_edge/probe_edge_verify collision checks
edge_probe_raw_hold_frames=60
; Frames to hold each auto-step press before waiting for movement
auto_step_inject_limit=12
; Shorter hold for the last same-direction queued step before a turn
auto_step_route_pre_turn_inject_limit=10
; Frames before re-pressing after a turn-only attempt
auto_step_turn_repress_delay=18
; Number of quick turn-only re-press attempts before timeout retries
auto_step_turn_repress_limit=1
; Neutral frames between turn-only press and re-press
auto_step_turn_repress_release_frames=2
; Internal retries before reporting a blocked step
auto_step_block_retry_limit=1
; Queued-route retries before reporting a blocked step
auto_step_route_block_retry_limit=2
; Extra neutral frames before queued auto-walk changes direction
auto_step_route_turn_settle_frames=16
; Queued-route subpixel twitches at/before this frame keep holding input until the inject limit
auto_step_route_early_release_grace_frames=10
; Extra frames to hold released manual taps after an early movement twitch
auto_step_manual_early_hold_frames=8
; Frames after movement twitch before retrying a queued-route turn re-press
auto_step_route_turn_repress_timeout_frames=24
; Frames after early queued-route movement twitch before seam retry
auto_step_route_early_twitch_timeout_frames=32
; Extra frames to hold seam retry after movement starts
auto_step_seam_retry_hold_after_start_frames=12
; Release injected D-pad once movement subpixel changes to reduce cell overshoot
auto_step_release_on_movement_start=true
; Speak auto-walk progress every N completed queued steps on longer routes (0 = off)
auto_walk_progress_interval=12
; Continue through overworld route waypoints until interrupted (false keeps one waypoint per auto-walk command)
overworld_auto_walk_continuous=true
; Frames to hold a target NPC in place after auto-walk arrival (0 = off)
auto_walk_npc_hold_frames=1200
; Frames to press toward an auto-walk interaction target after arrival (0 = off)
auto_walk_face_target_frames=8
; Park mobile non-target NPCs during interior auto-walk routes (experimental; may affect emulator lag)
auto_walk_park_mobile_npcs=true
; Frames to hold a selected NPC after teleport, until TALK starts (0 = off)
teleport_npc_hold_frames=600
; Frames to press toward a selected teleport interaction target after landing
teleport_face_target_frames=4
; Frames to skip heavy text/menu scans immediately after teleport
teleport_post_scan_grace_frames=45
; Frames after teleport to keep movement state/subpixel normalized
teleport_state_guard_frames=12
; Frames the Yes/No cursor must be absent before prompt is dismissed
yesno_dismiss_frames=16
; Speak tile types at player position
key_diag_tiles=Ctrl+N
; Also write full tile_diag.txt when pressing Ctrl+N (slow; debugging only)
tile_diag_dump_on_hotkey=false

; === Settings added by script update ===
; Dump title screen cursor/RAM state to title_diag.txt (use on adventure log or message speed screens)
key_diag_title=Ctrl+Y

; === Settings added by script update ===
; Set true to enable dw_debug.log and dw_commands.txt processing
debug_mode=true
; Log verbosity when debug_mode=true: ERROR, INFO, or DEBUG
debug_log_level=DEBUG
; Set true to log every tile in chosen paths (slow; debugging only)
pathfind_log_steps=false

; === Settings added by script update ===
; Suppress duplicate queued speech within this many milliseconds (0 to disable)
speech_debounce_ms=1000
; Neutral keyboard/controller frames before queued warnings speak (12 is about 0.2 seconds)
warning_idle_frames=12



; === Settings added by script update ===
; Python executable for speech_bridge.py (set to .venv\Scripts\python.exe to use a local venv)
speech_python_cmd=python

; === Settings added by script update ===
; FCEUX only: project keyboard-to-pad bridge. It suspends during emulator
; menus/dialogs and modifier or screen-reader key chords.
enable_keyboard_input_bridge=true

; === Settings added by script update ===
; BizHawk only: enable mod hotkeys from input.get() (off by default to avoid stray screen-reader/typing keys)
enable_bizhawk_keyboard_hotkeys=false
; BizHawk only: enable developer diagnostic dump/cursor hotkeys while full keyboard hotkeys are off
; Default for shipping is false; currently true for the next manual test run.
enable_bizhawk_diagnostic_hotkeys=true
; BizHawk only: comma-separated config key names allowed when full keyboard hotkeys are off
; Player-safe readouts/object keys stay live; diagnostic flag adds developer diagnostics.
bizhawk_keyboard_hotkey_allowlist=key_position,key_hp,key_level,key_gold,key_experience,key_stats,key_screen_text,key_visible_area,key_object_prev,key_object_current,key_object_next,key_pathfind,key_route_guidance,key_route_status,key_auto_walk,key_stop_auto_walk,key_filter,key_filter_prev,key_filter_all,key_filter_next,key_pathability_filter,key_mark_visited,key_teleport_exact,key_teleport_north,key_teleport_south,key_teleport_west,key_teleport_east,key_freeze_npcs,key_diag_tiles
; BizHawk only: include reachability/path checks in object descriptions (slower; pathfind still works)
bizhawk_object_reachability_descriptions=false
; BizHawk only: refresh moving NPC objects in the background (off avoids periodic audio hitches)
bizhawk_periodic_npc_refresh=false
; BizHawk only: prebuild pathfinding tile grids on map entry (faster first route, slower transitions)
bizhawk_map_entry_prewarm_path_grid=false
; BizHawk only: refresh live NPC blockers before O/U path planning (slower)
bizhawk_route_refresh_npcs=false
; BizHawk only: freeze NPC RAM during auto-walk routes (slower)
bizhawk_autowalk_freeze_npcs=false
; BizHawk only: refresh object/NPC list immediately after route completion/cancel (slower)
bizhawk_route_cleanup_refresh_objects=false

; === Settings added by script update ===
; Cycle object reachability filter (All/Reachable/Unreachable)
key_pathability_filter=Shift+O

; === Settings added by script update ===
; Internal retries for player tap-to-step collisions (0 keeps wall bumps responsive)
auto_step_manual_block_retry_limit=0

; === Settings added by script update ===
; Debug only: automatically append timed-out auto-step blocks to dw_blocks.log (off avoids noisy map data)
auto_step_record_debug_blocks=false

; === Settings added by script update ===
; Experimental: clear stale movement RAM during queued route turns. Keep false; true reproduced stat corruption in FCEUX.
auto_step_reset_movement_on_route_turn_settle=false

; Open the grouped Mod Settings menu
key_mod_settings=Shift+F11
; Open Key Reference, or explain the selected option inside Mod Settings
key_mod_help=Shift+F12

; Low-health warning and percentage of maximum HP
; Announce travel hazards, light changes, and hazard or darkness stops; movement safeguards remain active when off
travel_warnings=true
low_health_warning=true
low_health_threshold_percent=25
